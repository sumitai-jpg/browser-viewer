<!doctype html><html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Live View — ブラウザ作業の可視化</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Zen+Old+Mincho:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f1113; --panel:#161a1d; --line:#262c31; --ink:#e9e7e2; --dim:#8b938f;
  --live:#7ee0b8; --warn:#e4b363;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:Inter,"Noto Sans JP",sans-serif;-webkit-font-smoothing:antialiased}
.wrap{display:grid;grid-template-columns:330px 1fr;height:100vh;min-height:620px}
.side{border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;padding:22px 20px 0}
.brand{display:flex;align-items:baseline;gap:10px;margin-bottom:22px}
.brand b{font-family:"Zen Old Mincho",serif;font-weight:500;font-size:19px;letter-spacing:.06em}
.brand span{font-family:"JetBrains Mono",monospace;font-size:10px;color:var(--dim);letter-spacing:.12em}
label{display:block;font-family:"JetBrains Mono",monospace;font-size:10px;color:var(--dim);letter-spacing:.14em;margin-bottom:7px}
input[type=url]{width:100%;background:#0c0e10;border:1px solid var(--line);color:var(--ink);border-radius:6px;
padding:10px 11px;font-family:"JetBrains Mono",monospace;font-size:12px;outline:none}
input[type=url]:focus{border-color:#3a4650}
.row{display:flex;gap:8px;margin-top:14px}
button{border:1px solid var(--line);background:#1d2226;color:var(--ink);border-radius:6px;padding:11px 14px;
font-family:Inter;font-size:12.5px;font-weight:500;cursor:pointer;transition:.14s}
button:hover{background:#232a2f}
button.primary{background:var(--live);color:#08130f;border-color:var(--live);font-weight:600;flex:1}
button.primary:hover{filter:brightness(1.08)}
button.rec{color:var(--warn);border-color:#3a3122}
button.rec.on{background:var(--warn);color:#191207;border-color:var(--warn)}
button:disabled{opacity:.4;cursor:default}
.meta{margin-top:20px;border-top:1px solid var(--line);padding-top:16px;display:grid;gap:10px}
.kv{display:flex;justify-content:space-between;font-family:"JetBrains Mono",monospace;font-size:11px}
.kv span{color:var(--dim)}
.kv b{font-weight:500}
.logwrap{margin-top:18px;border-top:1px solid var(--line);padding-top:14px;flex:1;display:flex;flex-direction:column;min-height:0}
.logwrap h4{font-family:"JetBrains Mono",monospace;font-size:10px;color:var(--dim);letter-spacing:.14em;font-weight:400;margin-bottom:8px}
#log{flex:1;overflow:auto;font-family:"JetBrains Mono",monospace;font-size:11px;line-height:1.85;color:#a7afa9;padding-bottom:16px}
#log div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#log time{color:#5c6461;margin-right:8px}
#log .ok{color:var(--live)}
#log .warn{color:var(--warn)}
.stage{position:relative;display:flex;flex-direction:column;padding:22px 24px 20px;min-width:0}
.head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.head h1{font-family:"Zen Old Mincho",serif;font-weight:500;font-size:17px;letter-spacing:.05em}
.livebadge{display:flex;align-items:center;gap:7px;font-family:"JetBrains Mono",monospace;font-size:10px;color:var(--dim);letter-spacing:.16em}
.dot{width:7px;height:7px;border-radius:50%;background:#3d444a}
.livebadge.on .dot{background:var(--live);box-shadow:0 0 0 0 rgba(126,224,184,.6);animation:pulse 1.8s infinite}
.livebadge.on{color:var(--live)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(126,224,184,.55)}70%{box-shadow:0 0 0 9px rgba(126,224,184,0)}100%{box-shadow:0 0 0 0 rgba(126,224,184,0)}}
.screen{position:relative;flex:1;min-height:0;background:#08090a;border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;align-items:center;justify-content:center}
#frame{width:100%;height:100%;object-fit:contain;display:block;background:#08090a}
.empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;color:#4b5257;font-size:12.5px}
.empty b{font-family:"Zen Old Mincho",serif;font-weight:500;font-size:15px;color:#6a7377}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:12px;font-family:"JetBrains Mono",monospace;font-size:10.5px;color:var(--dim);letter-spacing:.06em}
.pill{border:1px solid var(--line);border-radius:999px;padding:4px 10px}
.pill.recording{border-color:var(--warn);color:var(--warn)}
@media(max-width:820px){
  .wrap{grid-template-columns:1fr;height:auto;min-height:100vh}
  .side{border-right:0;border-bottom:1px solid var(--line);padding-bottom:16px}
  .logwrap{max-height:180px}
  .stage{height:auto}
  .screen{min-height:46vh}
}
</style></head><body>
<div class="wrap">
  <aside class="side">
    <div class="brand"><b>Live View</b><span>BROWSER AGENT</span></div>
    <label for="url">TARGET URL</label>
    <input id="url" type="url" value="https://invox.jp/" spellcheck="false">
    <div class="row">
      <button class="primary" id="toggle">開始</button>
      <button class="rec" id="rec">録画</button>
    </div>
    <div class="meta">
      <div class="kv"><span>状態</span><b id="mState">待機</b></div>
      <div class="kv"><span>経過</span><b id="mTime">0.0s</b></div>
      <div class="kv"><span>フレーム</span><b id="mFrames">0</b></div>
      <div class="kv"><span>解像度</span><b id="mRes">—</b></div>
    </div>
    <div class="logwrap">
      <h4>ACTIVITY LOG</h4>
      <div id="log"></div>
    </div>
  </aside>
  <main class="stage">
    <div class="head">
      <h1>エージェントの作業</h1>
      <div class="livebadge" id="badge"><span class="dot"></span><span id="badgeText">OFF</span></div>
    </div>
    <div class="screen">
      <img id="frame" alt="">
      <div class="empty" id="empty"><b>まだ何も映っていない</b><span>URLを入れて「開始」を押すと、AIのブラウザが動き出す</span></div>
    </div>
    <div class="foot">
      <span id="fUrl">—</span>
      <span class="pill" id="fPill">待機中</span>
    </div>
  </main>
</div>
<script>
(function(){
  var FN = "https://solene-0e598278.base44.app/functions/browserViewProbe";
  var $ = function(id){ return document.getElementById(id); };
  var es = null, t0 = 0, timer = null, frames = 0, recording = false, recFrames = [], playing = null;

  function now(){ var d = new Date(); return d.toTimeString().slice(0,8); }
  function log(txt, cls){
    var d = document.createElement("div");
    d.innerHTML = "<time>" + now() + "</time>" + (cls ? '<span class="' + cls + '">' : "<span>") + txt + "</span>";
    $("log").prepend(d);
    while ($("log").children.length > 120) $("log").lastChild.remove();
  }
  function setState(s){ $("mState").textContent = s; }
  function tick(){
    if (!t0) return;
    $("mTime").textContent = ((Date.now() - t0)/1000).toFixed(1) + "s";
  }

  function start(){
    var url = $("url").value.trim();
    if (!url) return;
    stop(true);
    frames = 0; $("mFrames").textContent = "0";
    $("mRes").textContent = "—";
    $("empty").style.display = "none";
    $("fUrl").textContent = url;
    $("badge").classList.add("on"); $("badgeText").textContent = "LIVE";
    $("fPill").textContent = "配信中"; $("fPill").className = "pill";
    $("toggle").textContent = "停止";
    setState("接続中");
    t0 = Date.now(); timer = setInterval(tick, 100);
    log("接続を開始 " + url);

    es = new EventSource(FN + "?url=" + encodeURIComponent(url) + "&secs=180");
    es.addEventListener("status", function(e){
      var d = JSON.parse(e.data);
      if (d.step === "session") { setState("ブラウザ起動"); log("セッション作成 " + d.ms + "ms"); }
      else if (d.step === "navigated") { setState("巡回中"); log("ページ遷移 " + Math.round(d.ms/1000) + "s", "ok"); }
      else if (d.step === "tick") { log("フレーム " + d.frames + " 枚 / " + (d.ms/1000).toFixed(1) + "s"); }
    });
    es.addEventListener("frame", function(e){
      var d = JSON.parse(e.data);
      frames = d.n;
      $("frame").src = "data:image/jpeg;base64," + d.jpeg;
      $("mFrames").textContent = d.n;
      $("mRes").textContent = d.w + "×" + d.h;
      if (recording){
        recFrames.push(d.jpeg);
        if (recFrames.length > 240) recFrames.shift();
        $("rec").textContent = "録画 " + recFrames.length;
      }
    });
    es.addEventListener("done", function(e){
      var d = JSON.parse(e.data);
      log("完了 " + d.frames + " フレーム / " + (d.ms/1000).toFixed(1) + "s", "ok");
      finish("完了");
    });
    es.addEventListener("error", function(e){
      if (e.data){ try { log("エラー " + JSON.parse(e.data).error, "warn"); } catch(_){} }
      else { log("接続が切れた", "warn"); }
      finish("切断");
    });
    es.onerror = function(){ if (es && es.readyState === 2) finish("切断"); };
  }

  function finish(label){
    if (es){ try { es.close(); } catch(_){} es = null; }
    if (timer){ clearInterval(timer); timer = null; }
    $("badge").classList.remove("on"); $("badgeText").textContent = "OFF";
    $("toggle").textContent = "開始";
    $("fPill").textContent = label; $("fPill").className = "pill";
    setState(label);
    if (recording){ recording = false; $("rec").classList.remove("on"); $("rec").textContent = recFrames.length ? "再生 " + recFrames.length : "録画"; }
  }

  function stop(silent){
    if (es || timer){
      if (!silent) log("手動で停止", "warn");
      finish("停止");
    }
  }

  $("toggle").addEventListener("click", function(){
    if (es) { stop(); } else { start(); }
  });

  $("rec").addEventListener("click", function(){
    if (playing){ clearInterval(playing); playing = null; }
    if (recording){
      recording = false; this.classList.remove("on");
      this.textContent = recFrames.length ? "再生 " + recFrames.length : "録画";
      log("録画を停止 " + recFrames.length + " 枚");
      if (recFrames.length){ $("fPill").textContent = "録画 " + recFrames.length + " 枚"; }
    } else if (recFrames.length && !es){
      var i = 0, self = this;
      log("録画を再生 " + recFrames.length + " 枚");
      playing = setInterval(function(){
        $("frame").src = "data:image/jpeg;base64," + recFrames[i % recFrames.length];
        $("mFrames").textContent = (i % recFrames.length) + 1;
        i++;
        if (i > recFrames.length * 2){ clearInterval(playing); playing = null; self.textContent = "再生 " + recFrames.length; }
      }, 220);
    } else {
      recording = true; recFrames = []; this.classList.add("on"); this.textContent = "録画 0";
      log("録画を開始", "warn");
      if (!es) { log("録画は配信中のみ有効。先に開始してください", "warn"); recording = false; this.classList.remove("on"); this.textContent = "録画"; }
    }
  });

  log("待機中。URLを入れて開始を押す");
})();
</script></body></html>
